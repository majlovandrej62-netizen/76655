workflows:
  ios-bypass:
    name: Build Oxide Bypass
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        THEOS: $HOME/theos
    scripts:
      - name: Install Theos
        script: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $CM_ENV
      - name: Compile
        script: |
          mkdir -p oxide
          cp Bypass.xm oxide/
          cd oxide
          echo "ARCHS = arm64 arm64e" > Makefile
          echo "TARGET = iphone:clang:latest:15.0" >> Makefile
          echo "include \$(THEOS)/makefiles/common.mk" >> Makefile
          echo "TWEAK_NAME = oxide" >> Makefile
          echo "oxide_FILES = Bypass.xm" >> Makefile
          echo "include \$(THEOS_MAKE_PATH)/tweak.mk" >> Makefile
          make
    artifacts:
      - "**/*.dylib"
